name: Verify application (manual until source import)

# Manual-only until the real V35 application and regression tests are imported.
# Avoid consuming GitHub Actions runner minutes on documentation-only commits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure application source exists
        run: test -s source/all-aboard-personal.html
      - name: Check for accidentally committed private keys
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|[^/]+\.(pem|key|jks|keystore|p12)$)'; then
            echo "Potential secrets committed"
            exit 1
          fi
      - name: Validate inline JavaScript syntax
        run: python3 tests/check_inline_js.py source/all-aboard-personal.html
      # Enable regression suite only after importing the exact V35 test runner.
