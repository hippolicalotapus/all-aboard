<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Aboard fictional onboarding pilot</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:1rem;background:#f4f7fa;color:#14253b}header,section{background:white;padding:1rem;border-radius:12px;margin-bottom:1rem;border:1px solid #ccd5df}button,select{font:inherit;padding:.55rem;margin:.3rem;border-radius:7px}button{background:#153e72;color:white}button:disabled{opacity:.5}article{border-top:1px solid #ddd;padding:1rem 0}pre{white-space:pre-wrap;background:#f1f5f9;padding:1rem}label{display:block}</style></head><body><header><h1>All Aboard — Fictional workforce pilot</h1><p>Demo only. Not a valid safety sign-off or production employee record. Refresh resets all changes.</p><label for="role">View as</label><select id="role"><option value="employee">Employee</option><option value="safety-admin">Safety administrator</option><option value="foreman">Foreman</option></select></header><main id="view" aria-live="polite"></main><script src="../source/safety-document-model.js"></script><script src="../source/onboarding-workflow.js"></script><script src="../source/safety-revision-lifecycle.js"></script><script src="../source/onboarding-completion-records.js"></script><script src="../source/safety-audit-trail.js"></script><script>
'use strict';(()=>{
let docs=[{id:'swp-1',companyId:'demo',title:'Excavation procedure',revision:'1',type:'SWP',status:'approved',roles:['employee'],approvedBy:'safety'},{id:'jsa-1',companyId:'demo',title:'Mobile equipment hazard analysis',revision:'2',type:'JSA',status:'approved',roles:['employee'],approvedBy:'safety'}];
let content={'swp-1@1':'FICTIONAL EXAMPLE ONLY. Review excavation boundaries, locate buried services, verify protective systems, and stop work when conditions change.','jsa-1@2':'FICTIONAL EXAMPLE ONLY. Identify vehicle routes, establish separation zones, confirm communication and review changing site conditions.'};
const employee={id:'worker',companyId:'demo',role:'employee'},safety={id:'safety',companyId:'demo',role:'safety-admin'},foreman={id:'foreman',companyId:'demo',role:'foreman'},flha={id:'flha-1',companyId:'demo',foremanId:'foreman',revision:'1',status:'submitted'};
let records=[],review=null,draft=null,audit=[];const revisions=[];const viewed=new Set(),confirmed=new Set(),main=document.getElementById('view'),role=document.getElementById('role');
function node(tag,value){const e=document.createElement(tag);if(value!==undefined)e.textContent=value;return e}
function button(parent,label,callback,disabled=false){const b=node('button',label);b.disabled=disabled;b.addEventListener('click',callback);parent.append(b)}
function section(title){const e=node('section');e.append(node('h2',title));main.append(e);return e}
function log(type,actorId,subjectId,revision,decision){audit=SafetyAuditTrail.append(audit,{type,companyId:'demo',actorId,subjectId,revision:String(revision),at:new Date().toISOString(),decision});}
function render(){main.replaceChildren();
if(role.value==='employee'){const pkg=OnboardingWorkflow.packageFor(docs,employee,records),completion=OnboardingCompletionRecords.completion(employee,employee,docs,records),s=section('My safety onboarding');s.append(node('p',completion.completed+' of '+completion.total+' acknowledged'));
for(const item of pkg.items){const d=item.document,k=d.id+'@'+d.revision,a=node('article');a.append(node('h3',d.title+' — revision '+d.revision),node('p',item.acknowledged?'Acknowledged':'Not yet acknowledged'));
button(a,'Read document',()=>{viewed.add(k);render()});
if(viewed.has(k)){a.append(node('pre',content[k]));if(!item.acknowledged){const label=node('label'),c=node('input');c.type='checkbox';c.checked=confirmed.has(k);c.addEventListener('change',()=>{if(c.checked)confirmed.add(k);else confirmed.delete(k);render()});label.append(c,document.createTextNode(' I reviewed the fictional text above'));a.append(label);button(a,'Acknowledge this revision',()=>{records=OnboardingWorkflow.submitAcknowledgement(docs,employee,{documentId:d.id,revision:d.revision,reviewed:true,acknowledgedAt:new Date().toISOString()},records);log('employee-acknowledged',employee.id,d.id,d.revision);render()},!confirmed.has(k));}}s.append(a)}}
else if(role.value==='safety-admin'){
 const s=section('Employee onboarding progress');
 const summary=OnboardingCompletionRecords.completion(safety,employee,docs,records);s.append(node('p',summary.employeeId+': '+summary.completed+' of '+summary.total+' acknowledged'));for(const x of summary.records)s.append(node('p',x.documentId+' revision '+x.revision+': '+(x.acknowledged?'acknowledged':'pending')));
 const auditView=section('Fictional audit events');for(const e of SafetyAuditTrail.forViewer(audit,safety))auditView.append(node('p',e.sequence+'. '+e.type+' — '+e.subjectId+' revision '+e.revision+(e.decision?' ('+e.decision+')':'')));
 const editor=section('Controlled document publication (fictional)');
 if(draft){editor.append(node('p','Draft: '+draft.title+' revision '+draft.revision));editor.append(node('pre',draft.content));
 button(editor,'Approve and publish draft',()=>{const published=SafetyRevisionLifecycle.publish(draft,safety);const d=SafetyRevisionLifecycle.assignment(published);docs=docs.filter(x=>x.id!==d.id).concat(d);content[d.id+'@'+d.revision]=published.content;revisions.push(published);log('document-published',safety.id,d.id,d.revision);draft=null;render()});}
 else{
 const latest=revisions[revisions.length-1];
 button(editor,'Create new draft',()=>{draft=SafetyRevisionLifecycle.ingest({id:'orientation-demo',companyId:'demo',title:'Fictional site orientation',content:'FICTIONAL EXAMPLE ONLY. Review site access, emergency muster points and reporting procedures.',type:'ORIENTATION',roles:['employee']},safety);log('draft-created',safety.id,draft.id,draft.revision);render()},!!latest);
 if(latest)button(editor,'Create revised draft',()=>{draft=SafetyRevisionLifecycle.revise(latest,safety,latest.content+' Updated fictional revision controls.');log('revision-created',safety.id,draft.id,draft.revision);render()});
 }
 editor.append(node('p','Drafts are not assigned. Publication is required before employees can acknowledge the new revision.'));
}
else{const s=section('Assigned FLHA');s.append(node('p','FLHA '+flha.id+' revision '+flha.revision+' — submitted'));s.append(node('pre','Fictional work: excavation. Hazards: moving machinery and buried services. Controls: exclusion zone and service locate.'));if(review){const current=SafetyRevisionLifecycle.reviewStatus(flha,review);s.append(node('p','Decision: '+current.status+' on revision '+current.reviewedRevision));return}button(s,'Approve revision',()=>{review=OnboardingWorkflow.flhaReview(flha,foreman,{status:'approved',reviewedAt:new Date().toISOString()});log('flha-reviewed',foreman.id,flha.id,review.revision,review.status);render()});button(s,'Return for correction',()=>{review=OnboardingWorkflow.flhaReview(flha,foreman,{status:'returned',reason:'Clarify protective controls',reviewedAt:new Date().toISOString()});log('flha-reviewed',foreman.id,flha.id,review.revision,review.status);render()})}}
role.addEventListener('change',render);render();
})();
</script></body></html>
