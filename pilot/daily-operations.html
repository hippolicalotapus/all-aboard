<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Aboard — Fictional Daily Operations</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172e42;background:#eff4f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0 auto;max-width:1120px;padding:36px 28px 64px;line-height:1.6}h1,h2,p{margin-top:0}h1{font-size:2.5rem;line-height:1.15;letter-spacing:-.04em;margin-bottom:14px}h2{font-size:1.1rem;letter-spacing:-.015em;margin-bottom:16px}button,select{max-width:100%;overflow-wrap:anywhere;font:inherit;min-height:48px;border-radius:10px;padding:10px 16px}button{border:1px solid #b9cbd2;background:#fff;color:#173b4b;cursor:pointer;font-weight:650;margin:8px 8px 8px 0}button:hover:not(:disabled){background:#eaf6f3;border-color:#16735f}button:disabled{color:#647681;background:#e7edf0;border-color:#cdd9de;cursor:not-allowed}select{display:block;margin:6px 0 26px;max-width:100%;background:#fff;border:1px solid #9bafb9;color:#172e42}label{font-size:.85rem;font-weight:700}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #087d68;outline-offset:4px}section{background:#fff;border:1px solid #d3dfe4;border-radius:18px;padding:24px;margin:0 0 20px;box-shadow:0 4px 20px #18384805;min-width:0;overflow-wrap:anywhere}section p:last-child{margin-bottom:0}.eyebrow{font-size:.73rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#267362;margin-bottom:16px}.intro{max-width:64ch;color:#526775;margin-bottom:24px}.notice{border-left:3px solid #a9cabe;padding-left:14px;font-size:.82rem;color:#526775}.workspace-head{padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid #ccd9de}.report-context{display:flex;flex-wrap:wrap;gap:8px 24px;color:#526775;font-size:.85rem}.readiness{border-left:4px solid #bb863d}.readiness.ready{border-left-color:#16735f}.status{display:inline-block;font-size:.8rem;font-weight:750;color:#7b5320;background:#fff1d9;border-radius:99px;padding:5px 12px}.record{padding:12px 0;border-bottom:1px solid #edf1f3}.record:last-child{border-bottom:0}.primary{background:#135e50;color:#fff;border-color:#135e50}.primary:hover:not(:disabled){background:#0d4a3f;color:#fff}.history{font-size:.9rem;color:#526775}main{max-width:900px}a{color:#176751} @media(min-width:800px){body{padding-top:52px}main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}main>section{margin:0}main>.readiness,main>.history,main>button,main>p{grid-column:1/-1}} @media(max-width:480px){h1{font-size:2rem}body{padding:24px 16px 40px}section{padding:20px;border-radius:14px}button{width:100%;margin-right:0}select{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}@media print{body{background:#fff;padding:0;max-width:none;font-size:11pt}select,body>label,button,.notice{display:none}main{display:block;max-width:none}section{box-shadow:none;break-inside:avoid;border-color:#aaa;padding:16px;margin:12px 0}.workspace-head{margin-bottom:16px;padding-bottom:12px}}
.correction{padding:4px 0 12px}.correction summary{cursor:pointer;min-height:44px;color:#176751;font-weight:700;padding:10px 0}.correction label{display:block;margin:10px 0 5px}.correction input{font:inherit;font-size:16px;width:100%;min-height:48px;padding:10px;border:1px solid #9bafb9;border-radius:8px}.correction input:focus-visible{outline:3px solid #087d68;outline-offset:3px}.correction p{font-size:.85rem;color:#783b28}@media print{.correction{display:none}}
</style></head><body><header class="workspace-head"><p class="eyebrow">Workforce operations · Test workspace</p><h1>Daily operations</h1><p class="intro">Your field entries, assembled into one daily report. Review the items that need attention, then confirm the draft.</p><p class="notice">Fictional pilot · In-memory demonstration only. No payroll, costs, production records or safety approvals are submitted.</p></header><label for="role">View as</label><select id="role"><option value="foreman">Foreman</option><option value="superintendent">Superintendent</option><option value="accounting">Accounting</option><option value="employee">Employee (restricted)</option></select><main id="view" aria-live="polite"></main><script src="../source/daily-operations-report.js"></script><script src="../source/daily-operations-pilot.js"></script><script src="../source/daily-report-lifecycle.js"></script><script>
'use strict';
const context={companyId:'demo',projectId:'project-1',date:'2026-11-13'};
let entries=[
{id:'time-1',...context,kind:'time',quantity:8,unit:'hours',sourceId:'timesheet-1',status:'verified',source:'time-entry'},
{id:'prod-1',...context,kind:'production',quantity:120,unit:'metres',sourceId:'field-1',status:'verified',source:'field-entry'},
{id:'equip-1',...context,kind:'equipment',quantity:6,unit:'hours',sourceId:'equipment-1',status:'verified',source:'equipment-log'},
{id:'plan-1',...context,kind:'material',quantity:30,unit:'units',sourceId:'flha-1',status:'planned',source:'flha-plan'}];
let state=DailyReportLifecycle.start(entries,context),actionCounter=0;
function apply(type,recordId,quantity,reason){state=DailyReportLifecycle.action(state,actor(),{type,recordId,quantity,reason:type==='exclude'?'Fictional planned item is not actual work':reason,expectedRevision:state.revision,actionId:'pilot-'+(++actionCounter)});render();}
const role=document.getElementById('role'),main=document.getElementById('view');
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
function button(text,action){const n=el('button',text);n.type='button';n.addEventListener('click',action);return n;}
function actor(){return {id:'fictional-'+role.value,role:role.value,companyId:'demo',projectId:'project-1',projectIds:['project-1']};}
function correction(item){
 const editor=el('details','');editor.className='correction';
 const summary=el('summary','Correct '+item.kind+' entry');summary.id='correct-'+item.id;
 const quantity=el('input','');quantity.id='quantity-'+item.id;quantity.type='number';quantity.min='0';quantity.step='any';quantity.inputMode='decimal';quantity.value=String(item.quantity);
 const quantityLabel=el('label','Corrected '+item.kind+' quantity ('+item.unit+')');quantityLabel.htmlFor=quantity.id;
 const reason=el('input','');reason.id='reason-'+item.id;reason.type='text';reason.maxLength=500;reason.value='';
 const reasonLabel=el('label','Reason for '+item.kind+' correction');reasonLabel.htmlFor=reason.id;
 const message=el('p','');message.id='correction-status-'+item.id;message.setAttribute('role','status');
 quantity.setAttribute('aria-describedby',message.id);reason.setAttribute('aria-describedby',message.id);
 const save=button('Save '+item.kind+' correction',()=>{
  const raw=quantity.value.trim(),note=reason.value.trim();
  if(!raw||!Number.isFinite(Number(raw))||Number(raw)<0){message.textContent='Enter a valid non-negative quantity.';return;}
  if(note.length<5||note.length>500){message.textContent='Give a reason of 5 to 500 characters.';return;}
  try{apply('correct',item.id,Number(raw),note);document.getElementById(summary.id).focus();}catch(error){message.textContent=error.message;}
 });
 const cancel=button('Cancel '+item.kind+' correction',()=>{quantity.value=String(item.quantity);reason.value='';message.textContent='';editor.open=false;summary.focus();});
 editor.append(summary,quantityLabel,quantity,reasonLabel,reason,save,cancel,message);return editor;
}
function render(){
 main.replaceChildren();const report=state.report;
 let v;try{DailyReportLifecycle.view(state,actor());v=DailyOperationsPilot.view(report,actor());}catch(err){main.append(el('p','Access restricted for this role.'));return;}
 const readiness=el('section','');readiness.className='readiness'+(!v.exceptions.length?' ready':'');readiness.append(el('h2',v.status==='foreman-approved'?'Fictional review recorded':v.exceptions.length?'Review '+v.exceptions.length+' item'+(v.exceptions.length===1?'':'s')+' before approval':'Ready for foreman review'),el('p',v.status==='foreman-approved'?'Reopen the report with a reason before making corrections.':v.exceptions.length?'Resolve the flagged source records below. Planned work is excluded from actuals.':'The draft has no unresolved source exceptions. Check each entry before confirming.'));main.append(readiness);
 const s=el('section','');s.append(el('h2','Project daily summary'));const status=el('p','Status: '+v.status);status.className='status';s.append(status,el('p',context.projectId+' · '+context.date));
 for(const item of v.entries){const row=el('div','');row.className='record';row.append(el('p',item.kind+': '+item.quantity+' '+item.unit+' (verified source '+item.sourceId+')'));if(v.role==='foreman'&&v.status==='draft')row.append(correction(item));s.append(row);}
 main.append(s);
 const e=el('section','');e.append(el('h2','Items requiring attention'));
 if(!v.exceptions.length)e.append(el('p','No unresolved exceptions.'));
 for(const item of v.exceptions){e.append(el('p',item.id+': '+({'not-verified-actual':'Planned or unverified entry — excluded from actuals','duplicate-record':'Repeated record — review before approval','duplicate-source':'Source already counted — review before approval','unsupported-kind':'Unsupported entry type — review before approval','invalid-quantity':'Quantity needs correction'}[item.reason]||'Source needs review')));if(v.role==='foreman'&&v.status==='draft')e.append(button('Dismiss fictional '+item.id,()=>{try{apply('exclude',item.id);}catch(err){main.append(el('p',err.message));}}));}
 main.append(e);
 if(v.role==='foreman'&&v.status==='foreman-approved'){
  const reopen=el('section','');reopen.className='correction';
  const reason=el('input','');reason.id='reopen-reason';reason.type='text';reason.value='';
  const label=el('label','Reason for reopening (at least 5 characters)');label.htmlFor=reason.id;
  const message=el('p','');message.id='reopen-status';message.setAttribute('role','status');reason.setAttribute('aria-describedby',message.id);
  reopen.append(label,reason,button('Reopen approved report',()=>{try{apply('reopen',undefined,undefined,reason.value);}catch(err){message.textContent=err.message;reason.focus();}}),message);main.append(reopen);
 }
 if(v.role==='foreman'&&v.status==='draft'){const approve=button('Approve daily report',()=>{try{apply('approve');}catch(err){main.append(el('p',err.message));}});approve.disabled=!v.canApprove;approve.className='primary';main.append(approve);}
 const audit=el('section','');audit.className='history';audit.append(el('h2','Fictional report history'));if(!state.events.length)audit.append(el('p','No review actions yet. Changes will appear here.'));for(const event of state.events)audit.append(el('p',event.sequence+'. '+event.type+' by '+event.actorId+(event.recordId?' for '+event.recordId:'')+(event.type==='correct'?' — '+event.oldQuantity+' → '+event.newQuantity:'')+(event.reason?' — '+event.reason:'')));main.append(audit);
 if(v.role!=='foreman')main.append(el('p','Read-only operational overview; no approval authority.'));
}
role.addEventListener('change',render);render();
</script></body></html>
